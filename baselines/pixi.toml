[workspace]
channels = ["conda-forge"]
name = "mn-baselines"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[environments]
# <env_name> = ["<feature_name>"]
# add feature first, and then use pixi workspace to link environment to a specific feature
mnfinder = ["mnf"]
cellpose3 = ["cp3"]
microsam = ["microsam"]
cpsam = ["cpsam"]


[system-requirements]
cuda = "12.3"

[dependencies]
dust = ">=1.2.3,<2"
python = ">3.11, <3.13"
ipykernel = "*"

[pypi-dependencies]
tqdm = ">=4.67.1, <5"
scikit-image = ">=0.25.2, <0.26"
scikit-learn = ">=1.7.2, <2"
wandb = ">=0.22.3, <0.23"

[feature.mnf.dependencies]
python = ">3.11, <3.13"

[feature.mnf.pypi-dependencies]
mnfinder = "==1.2.3"
tensorflow = { version = ">=2.15.0, <3", extras = ["and-cuda"] }
numpy = "<2.0.0"


[feature.cp3.dependencies]
python = "3.12.*"

[feature.cp3.pypi-dependencies]
cellpose = "==3.1.0"
numpy = ">=2.0.2, <3"
pandas = ">=2.3.3, <3"
torch = ">=2.9.0, <3"
matplotlib = ">=3.10.7, <4"
seaborn = ">=0.13.2, <0.14"
tqdm = ">=4.67.1, <5"


[feature.microsam.dependencies]
python = "3.12.*"
micro_sam = { version = "==1.6.2", channel = "conda-forge" }
torch_em = { version = ">=0.7.12", channel = "conda-forge" }

[feature.microsam.pypi-dependencies]
torch = "*"
napari = ">=0.5, <0.7.0"

[feature.cpsam.dependencies]
python = "3.12.*"

[feature.cpsam.pypi-dependencies]
cellpose = ">=4.0.7, <5"
numpy = ">=2.3.5, <3"
pandas = ">=2.3.3, <3"
matplotlib = ">=3.10.7, <4"
torch = ">=2.9.1, <3"
seaborn = ">=0.13.2, <0.14"
tqdm = ">=4.67.1, <5"



