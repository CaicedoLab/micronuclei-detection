[workspace]
channels = ["conda-forge"]
name = "iou-analysis"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.8"

[dependencies]
dust = ">=1.2.3,<2"
python = ">3.11, <3.13"
ipykernel = "*"

[pypi-dependencies]
tqdm = ">=4.67.1, <5"
scikit-image = ">=0.25.2, <0.26"
scikit-learn = ">=1.7.2, <2"
wandb = ">=0.22.3, <0.23"
huggingface-hub = { version = ">=2.0.0, <3", extras = ["cli", "torch"] }
mndino = ">=0.0.0.3, <0.0.0.4"
numpy = ">=2.5.3, <3"
cellpose = ">=4.2.1.1, <5"
micro-sam = ">=1.8.3, <2"



