[workspace]
name = "mndino"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.8"
 
[dependencies]
python = "3.12.*"
pip = "*"
setuptools = "<82"


[pypi-dependencies]
torch = { version = "==2.11.*", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.26.*", index = "https://download.pytorch.org/whl/cu128" }
scikit-image = ">=0.26.0, <0.27"
scikit-learn = ">=1.9.1, <2"
tqdm = ">=4.70.1, <5"
numpy = ">=2.5.3, <3"
pandas = ">=3.0.6, <4"
wandb = ">=0.30.0, <0.31"
# torchmetrics = ">=1.9.0, <2" # dinov3
# termcolor = ">=3.3.0, <4" # dinov3
