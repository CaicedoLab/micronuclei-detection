[workspace]
name = "mndino"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.8"
 
[dependencies]
python = "3.12.*"
pip = "*"
ipykernel = "*"


[pypi-dependencies]
torch = ">=2.14.0, <3"
scikit-image = ">=0.26.0, <0.27"
wandb = ">=0.30.0, <0.31"
tqdm = ">=4.70.1, <5"
numpy = ">=2.5.3, <3"
matplotlib = ">=3.11.2, <4"
pandas = ">=3.0.6, <4"
torchvision = ">=0.29.0, <0.30"
cellpose = ">=4.2.1.1, <5"
